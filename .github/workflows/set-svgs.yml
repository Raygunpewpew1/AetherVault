name: Sync set symbol SVGs

on:
  schedule:
    # Day after weekly MTG DB refresh (Tue 12:00 UTC)
    - cron: '0 14 * * 2'
  workflow_dispatch:

jobs:
  sync-set-svgs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Sync missing set SVGs from Scryfall
        run: dotnet run --project tools/SyncSetSvgs/SyncSetSvgs.csproj -c Release

      - name: Commit new SVGs if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/SVGSets/*.svg
          if git diff --staged --quiet; then
            echo "No new set SVGs."
            exit 0
          fi
          git commit -m "Add missing set symbol SVGs from Scryfall"
          git push
